
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - MeetStyle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<header class="site-header">

    <div class="header-brand">
        <img src="images/MeetStyle-logo.png.png"
             alt="MeetStyle"
             class="meetstyle-logo-image">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shoes.html">Shoes</a>
        <a href="sandals.html">Sandals</a>
        <a href="cart.html">My Cart 🛒</a>
    </nav>

    <div class="cart-badge">
        🛒 Cart: <span id="header-cart-count">0</span>
    </div>

</header>

    <main>
        <h2>My Shopping Cart 🛒</h2>
        <p>Review your selected products before checkout.</p>

        <section id="cart">
            <h2>Your Products</h2>

            <p>
                Items in Cart:
                <span id="cart-count">0</span>
            </p>

            <ul id="cart-items"></ul>

            <button onclick="clearCart()">
                Clear Cart 🗑️
            </button>

            <h3>
                Total: ₹<span id="cart-total">0</span>
            </h3>

            <p>
                <p>
    <a href="index.html">← Continue Shopping</a>
</p>

<a href="checkout.html" class="checkout-btn">
    Proceed to Checkout →
</a>
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 MeetStyle. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
