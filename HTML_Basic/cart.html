
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - MeetStyle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-brand">
            <img src="images/MeetStyle-logo.png.png"
                 alt="MeetStyle"
                 class="meetstyle-logo-image">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="shoes.html">Shoes</a>
            <a href="sandals.html">Sandals</a>
        </nav>

        <a href="cart.html" class="cart-badge">
            🛒 My Cart <span id="header-cart-count">0</span>
        </a>
    </header>

    <main class="cart-page">

        <section class="cart-heading">
            <p class="cart-eyebrow">YOUR SHOPPING BAG</p>
            <h1>My Shopping Cart 🛒</h1>
            <p>Review your favourite picks before checkout.</p>
        </section>

        <section class="cart-card">

            <div class="cart-card-heading">
                <h2>Your Selected Products</h2>
                <span class="cart-item-count">
                    Items: <span id="cart-count">0</span>
                </span>
            </div>

            <ul id="cart-items"></ul>

            <div class="cart-actions">
                <button type="button"
                        class="clear-cart-btn"
                        onclick="clearCart()">
                    Clear Cart 🗑️
                </button>
            </div>

            <div class="cart-total-row">
                <span>Order Total</span>
                <strong>₹<span id="cart-total">0</span></strong>
            </div>

            <div class="cart-bottom-actions">
                <a href="index.html" class="continue-shopping">
                    ← Continue Shopping
                </a>

                <a href="checkout.html" class="checkout-btn">
                    Proceed to Checkout →
                </a>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 MeetStyle. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
