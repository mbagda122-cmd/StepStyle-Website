
<!DOCTYPE html>

    <header>

                Total: ₹<span id="cart-total">0</span>
            </h3>

            <p>
                <p>
    <a href="index.html">← Continue Shopping</a>
</p>

<a href="checkout.html" class="checkout-btn">
    Proceed to Checkout →
</a>

        </section>

        <p>© 2026 MeetStyle. All rights reserved.</p>
    </footer>
