
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MeetStyle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>MeetStyle 👟</h1>
        <p>Every Step, Your Style.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="shoes.html">Shoes</a>
            <a href="sandals.html">Sandals</a>
            <a href="cart.html">My Cart 🛒</a>
        </nav>

        <div class="cart-badge">
            🛒 Cart: <span id="header-cart-count">0</span>
        </div>
    </header>

    <main>

        <h2>Checkout 🛍️</h2>
        <p>Enter your delivery details below.</p>

        <div class="checkout-layout">

            <!-- Delivery Form -->
            <section class="checkout-form-section">
                <h2>Delivery Information</h2>

                <form id="checkout-form">

                    <label for="customer-name">Full Name</label>
                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="customer-phone">Mobile Number</label>
                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="Enter 10-digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                    <label for="customer-address">Delivery Address</label>
                    <textarea
                        id="customer-address"
                        placeholder="House number, street, area"
                        required
                    ></textarea>

                    <label for="customer-city">City</label>
                    <input
                        type="text"
                        id="customer-city"
                        placeholder="Enter your city"
                        required
                    >

                    <label for="customer-pincode">PIN Code</label>
                    <input
                        type="text"
                        id="customer-pincode"
                        placeholder="Enter 6-digit PIN code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        required
                    >

                    <label for="payment-method">Payment Method</label>
                    <select id="payment-method" required>
                        <option value="">Select payment method</option>
                        <option value="cod">Cash on Delivery</option>
                        <option value="upi">UPI (Demo Only)</option>
                    </select>

                    <button type="submit" class="checkout-submit">
                        Place Demo Order
                    </button>

                </form>

                <p id="checkout-message" role="status"></p>
            </section>

            <!-- Order Summary -->
            <section class="checkout-summary">
                <h2>Order Summary</h2>

                <ul id="checkout-items"></ul>

                <h3>
                    Total: ₹<span id="checkout-total">0</span>
                </h3>

                <a href="cart.html">← Back to Cart</a>
            </section>

        </div>

    </main>

    <footer>
        <p>© 2026 MeetStyle. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

    <script>
        let checkoutCart =
            JSON.parse(localStorage.getItem("stepStyleCart")) || [];

        const checkoutItems =
            document.getElementById("checkout-items");

        const checkoutTotal =
            document.getElementById("checkout-total");

        const checkoutMessage =
            document.getElementById("checkout-message");

        function showOrderSummary() {
            checkoutItems.innerHTML = "";

            let total = 0;

            if (checkoutCart.length === 0) {
                const emptyItem = document.createElement("li");
                emptyItem.textContent = "Your cart is empty.";
                checkoutItems.appendChild(emptyItem);
            }

            checkoutCart.forEach(function(product) {
                const item = document.createElement("li");

                item.textContent =
                    product.name + " - ₹" +
                    Number(product.price).toLocaleString("en-IN");

                checkoutItems.appendChild(item);

                total += Number(product.price) || 0;
            });

            checkoutTotal.textContent =
                total.toLocaleString("en-IN");
        }

        showOrderSummary();

        document.getElementById("checkout-form")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                if (checkoutCart.length === 0) {
                    checkoutMessage.textContent =
                        "Your cart is empty. Please add a product first.";
                    return;
                }

                checkoutMessage.textContent =
                    "Form test successful! This is a demo only. " +
                    "No real order was placed and no payment was taken.";
            });
    </script>

</body>
</html>
