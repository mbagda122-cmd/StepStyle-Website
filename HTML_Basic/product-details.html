
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - MeetStyle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="header-brand">
        <img src="images/MeetStyle-logo.png.png"
             alt="MeetStyle"
             class="meetstyle-logo-image">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shoes.html">Shoes</a>
        <a href="sandals.html">Sandals</a>
        <a href="cart.html">My Cart 🛒</a>
    </nav>

    <div class="cart-badge">
        🛒 Cart: <span id="header-cart-count">0</span>
    </div>

</header>

<main>

    <section class="product-detail-layout">

        <div class="product-detail-image">
            <img
                id="detail-image"
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                alt="Selected footwear">
        </div>

        <div class="product-detail-info">

            <p class="featured-label">MEETSTYLE COLLECTION</p>

            <h2 id="detail-name">Running Shoes 👟</h2>

            <h3 id="detail-price">₹1,499</h3>

            <p id="detail-description">
                Discover stylish and comfortable footwear
                for your everyday journey.
            </p>

            <button id="details-add-to-cart">
                Add to Cart 🛒
            </button>

            <p>
                <a href="index.html">← Continue Shopping</a>
            </p>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 MeetStyle. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
